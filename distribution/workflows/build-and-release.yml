name: Build & Release Multi-OS Binaries

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            target_name: hwscan-windows-x64.exe
          - os: ubuntu-latest
            arch: x64
            target_name: hwscan-linux-x64
          - os: macos-latest
            arch: universal
            target_name: hwscan-macos-universal

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psutil rich pyinstaller
          pip install -e .

      - name: Compile Standalone Binary
        run: |
          python build.py

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target_name }}
          path: dist/${{ matrix.target_name }}

  release:
    name: Publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release with Binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          title: "Hardware Gauntlet Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
